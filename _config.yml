# Settings for the free GitHub Pages site at https://koilparampil-family.github.io/
#
# The plugins below ship with GitHub Pages and are what turn a folder of plain
# Markdown into a website:
#   optional-front-matter  every .md file becomes a page, with no YAML header
#                          to confuse whoever is editing it
#   readme-index           README.md becomes the home page
#   relative-links         rewrites "[Name](Other_Page.md)" to the built page,
#                          so the same file reads correctly on github.com too.
#                          It only rewrites plain destinations -- a name in
#                          <angle brackets> is skipped and the reader ends up
#                          staring at raw Markdown, which is why page names are
#                          slugged to characters that need no brackets.
#   titles-from-headings   the "# Title" line becomes the page title

title: Koilparampil Family
description: Genealogy and history of the Koilparampil family, Kerala, India.
logo: /logo/st_thoma.jpg

# Every page gets the sidebar layout in _layouts/default.html. This is plain
# Jekyll rather than a plugin, so it does not depend on anything GitHub might
# change, and the Markdown files stay free of YAML headers.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Keep the "# Title" line visible in the page itself; it is only borrowed for
# the browser tab.
titles_from_headings:
  strip_title: false

# Addresses without a ".html" on the end: each page is built as its own
# folder, so "Name.md" is served at "/Name/". Typing "/Name" works too --
# GitHub redirects it to the folder.
permalink: pretty

plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: false

exclude:
  - mediawiki_to_markdown.py
  - md_verify.py
